services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: resume_analyzer
      POSTGRES_PASSWORD: resume_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: ["node", "src/server.js"]
    environment:
      PORT: 5000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      MONGO_URI: mongodb://mongo:27017/resume_analyzer
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://resume_analyzer:resume_analyzer@postgres:5432/resume_analyzer
      RESUME_ANALYSIS_CONCURRENCY: 2
      RESUME_FILE_RETENTION_DAYS: ${RESUME_FILE_RETENTION_DAYS:-90}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      RESUME_UPLOADS_BUCKET: ${RESUME_UPLOADS_BUCKET:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_DEFAULT_COUNTRY: ${ADZUNA_DEFAULT_COUNTRY:-in}
      ADZUNA_RESULTS_PER_PAGE: ${ADZUNA_RESULTS_PER_PAGE:-20}
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo
      - redis
      - postgres

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: ["npm", "run", "worker"]
    environment:
      MONGO_URI: mongodb://mongo:27017/resume_analyzer
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://resume_analyzer:resume_analyzer@postgres:5432/resume_analyzer
      RESUME_ANALYSIS_CONCURRENCY: 2
      RESUME_FILE_RETENTION_DAYS: ${RESUME_FILE_RETENTION_DAYS:-90}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      RESUME_UPLOADS_BUCKET: ${RESUME_UPLOADS_BUCKET:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo
      - redis
      - postgres

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
  uploads-data:
  pg-data:
