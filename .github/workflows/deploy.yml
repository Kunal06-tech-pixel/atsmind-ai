name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ secrets.DOCKER_REGISTRY_USERNAME != '' }}
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: ${{ secrets.DOCKER_REGISTRY_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_REGISTRY_IMAGE_API || 'resume-analyzer-api' }}:${{ github.sha }}
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: ${{ secrets.DOCKER_REGISTRY_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_REGISTRY_IMAGE_WORKER || 'resume-analyzer-worker' }}:${{ github.sha }}

